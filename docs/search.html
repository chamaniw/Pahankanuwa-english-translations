<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search | Ven. Nāṇānanda Dhamma Reference</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="page-wrapper">
    <header>
        <h1><a href="index.html">Ven. Nāṇānanda Dhamma Reference Portal</a></h1>
    </header>

    <div class="layout">
        <nav class="sidebar">
            <div class="sidebar-section">
                <h3>Navigation</h3>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="sermons/index.html" class="">Sermons Index</a></li>
                    <li><a href="stanzas/index.html" class="">Stanzas Index</a></li>
                    <li><a href="search.html" class="active">Search</a></li>
                </ul>
            </div>
        </nav>

        <main class="content">
            
    <h2>Search Knowledge Base</h2>
    <input type="text" id="searchInput" placeholder="Type Pāli or English term (e.g. tanha, vinnana, craving)..." 
           style="width: 100%; padding: 12px; font-size: 16px; border: 2px solid var(--line-color); margin-bottom: 20px;">
    <div id="searchResults"></div>

    <script>
    let searchData = [];
    fetch('search_index.json')
        .then(res => res.json())
        .then(data => searchData = data);

    function normalizeStr(str) {
        if (!str) return '';
        return str.replace(/[ṁṃ]/g, 'm').replace(/[ṀṂ]/g, 'M')
                  .normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
        const query = normalizeStr(e.target.value.trim());
        const resultsDiv = document.getElementById('searchResults');
        resultsDiv.innerHTML = '';

        if (query.length < 2) return;

        const matches = searchData.filter(item => item.norm_text.includes(query));
        
        if (matches.length === 0) {
            resultsDiv.innerHTML = '<p>No matching results found.</p>';
            return;
        }

        matches.forEach(item => {
            const div = document.createElement('div');
            div.className = 'item-card';
            div.innerHTML = `<div class="item-title"><a href="${item.url}">${item.title}</a></div>
                             <p><small>Type: ${item.type.toUpperCase()} | Source: ${item.source}</small></p>`;
            resultsDiv.appendChild(div);
        });
    });
    </script>
    
        </main>
    </div>

    <footer>
        <div class="copyright">
            &copy; 2026 Ven. Nāṇānanda Dhamma Text Project<br>
            <span style="font-size: 12px; color: #666;">Released for free distribution.</span>
        </div>
        <div class="contact">
            Pāli Reference & Knowledge Base
        </div>
    </footer>
</div>

</body>
</html>

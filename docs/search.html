table.data-table th, table.data-table td {

    white-space: normal;
}
table.data-table tr:nth-child(even) { background-color: #fcfaf7; }
table.data-table tr:hover { background-color: #f4eee6; }

/* Desktop Width Allocation */
table.data-table th:nth-child(1), table.data-table td:nth-child(1) { width: 15%; min-width: 110px; } /* Sermon */
table.data-table th:nth-child(2), table.data-table td:nth-child(2) { width: 30%; } /* Opening Passage Excerpt */
table.data-table th:nth-child(3), table.data-table td:nth-child(3) { width: 30%; } /* English Translation */
table.data-table th:nth-child(4), table.data-table td:nth-child(4) { width: 15%; } /* Likely Source */
table.data-table th:nth-child(5), table.data-table td:nth-child(5) { width: 10%; min-width: 90px; } /* Document Link */

/* Mobile Width Allocation (Keeping Document Links visible) */
@media (max-width: 768px) {
    table.data-table {
        font-size: 0.80rem;
    }
    table.data-table th, table.data-table td {

    table.data-table th:nth-child(3), table.data-table td:nth-child(3) { width: 37%; }
    table.data-table th:nth-child(4), table.data-table td:nth-child(4) { width: 0%; display: none; } /* Hide only Likely Source on mobile to save space */
    table.data-table th:nth-child(5), table.data-table td:nth-child(5) { width: 10%; min-width: 60px; display: table-cell; } /* Keep Document Link visible */

<body>


  <header class="site-header">
    <div class="header-container">
      <div class="brand-section">
        <div class="logo-title">Ven. Katukurunde Nanananda Thero</div>
        <div class="subtitle">English Translations of Pahankanuwa Sermons</div>
      </div>
      <div class="top-nav-wrapper">
        <nav class="top-nav">
          <a href="index.html">Home</a><a href="sermons.html">Sermons</a><a href="downloads.html">Downloads</a><a href="audio.html">Audio</a><a href="search.html" class="active">Search</a><a href="statistics.html">Statistics</a>
        </nav>
        <form action="search.html" method="get" class="header-search-form">
          <input type="text" name="q" class="header-search-input" placeholder="Search sermons..." aria-label="Search sermons">
        </form>
      </div>
    </div>
  </header>
  

<main class="homepage-content">

<section class="hero">

<h1>Search the Sermon Collection</h1>

<p>
Search all translated sermons,
including the Paticca Samuppada series.
Searches ignore diacritics,
so typing "paticca" will find "Paṭicca".
</p>

<input
id="searchBox"
class="search-input"
placeholder="Search..."
>

<div id="results"></div>

</section>

</main>

<script>

let searchData=[];

function normalize(str){
    return str
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase();
}

function getSnippet(content, query, maxLength = 250) {
    const lowerContent = content.toLowerCase();
    const index = lowerContent.indexOf(query);
    if (index === -1) {
        return content.substring(0, maxLength);
    }
    const start = Math.max(0, index - 80);
    const end = Math.min(content.length, start + maxLength);
    let snippet = content.substring(start, end);
    if (start > 0) snippet = "..." + snippet;
    if (end < content.length) snippet = snippet + "...";
    return snippet;
}

function performSearch() {
    const box = document.getElementById('searchBox');
    const query = normalize(box.value.trim());
    const results = document.getElementById('results');

    if (query.length < 2) {
        results.innerHTML = "";
        return;
    }

    const matches = searchData.filter(x => x.normalized.includes(query)).slice(0, 50);

    if (matches.length === 0) {
        results.innerHTML = "<p style='margin-top: 1.5rem; color: var(--text-muted);'>No matching sermons found.</p>";
        return;
    }

    results.innerHTML = matches.map(m => `
<div class="download-item">
  <div class="download-info">
    <h4>
      <a href="sermon_${m.sermon}.html">
        ${m.title}
      </a>
    </h4>
    <p>
      ${getSnippet(m.content, query, 250)}
    </p>
  </div>
</div>
`).join("");
}

fetch('search_index.json')
.then(r => r.json())
.then(data => {
    searchData = data;
    
    const urlParams = new URLSearchParams(window.location.search);
    const initialQuery = urlParams.get('q') || urlParams.get('search') || "";
    if (initialQuery) {
        const box = document.getElementById('searchBox');
        box.value = initialQuery;
        performSearch();
    }
});

document.getElementById('searchBox').addEventListener('input', performSearch);

</script>

</body>
